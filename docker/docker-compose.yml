version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pragyadrishti_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_2026
      POSTGRES_DB: pragyadrishti_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pragyadrishti_cache
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: pragyadrishti_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password_2026@postgres:5432/pragyadrishti_db
      - SECRET_KEY=pragyadrishti_production_secret_key_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: pragyadrishti_frontend
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
